name: CI / Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run Mathematical Cross-Validation
        run: |
          python sim/test_cross_validation.py

      - name: Run DeFi Flash-Loan Simulation
        run: |
          python sim/defi_flashloan_sim.py

      - name: Run 1,000-Test Sealed Battery & Verification
        run: |
          python tests/run_1000_sealed_battery.py

      - name: Run Orthogonal Parameter & All-States Lean 4 Bridge Verification
        run: |
          python tests/test_orthogonal_parameters.py
          python tests/test_all_states_and_lean4_bridge.py
          python tests/test_tripod_zmod9.py
          python tests/test_blockchain_resonance.py


