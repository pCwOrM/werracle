<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Glowing Filters -->
    <filter id="bloom-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b1" />
      <feGaussianBlur stdDeviation="32" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bloom-fine" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="bf" />
      <feMerge>
        <feMergeNode in="bf" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="star-sparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="bs" />
      <feMerge>
        <feMergeNode in="bs" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyan Facets (Left Half - WERR Wave Dynamics) -->
    <linearGradient id="c-crest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="c-spine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="c-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="c-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Gold Facets (Right Half - Protocol Value & Sovereign Reserves) -->
    <linearGradient id="g-crest" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="g-spine" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="g-dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="g-wing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- NEAR Green Consensus Orbital Halo Gradient -->
    <linearGradient id="near-halo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00EC97" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Oracle Iris Portal Gradients -->
    <radialGradient id="oracle-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0c1a3a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="oracle-plasma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00EC97" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00EC97" />
    </linearGradient>
  </defs>

  <!-- Ambient Energy Halos -->
  <circle cx="310" cy="380" r="190" fill="#0284c7" opacity="0.18" filter="url(#bloom-heavy)" />
  <circle cx="490" cy="380" r="190" fill="#d97706" opacity="0.18" filter="url(#bloom-heavy)" />
  <circle cx="400" cy="380" r="160" fill="#00EC97" opacity="0.14" filter="url(#bloom-heavy)" />

  <!-- Technical Orbital Coordinate Rings (Z mod 9 & Fixed Point Triad) -->
  <g stroke="#1e293b" fill="none" opacity="0.6">
    <circle cx="400" cy="380" r="260" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="400" cy="380" r="220" stroke="url(#near-halo)" stroke-width="1.8" stroke-dasharray="2 12" opacity="0.75" filter="url(#bloom-fine)" />
    <circle cx="400" cy="380" r="170" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="120" y1="380" x2="680" y2="380" stroke-width="0.8" stroke-dasharray="2 6" />
    <line x1="400" y1="100" x2="400" y2="660" stroke-width="0.8" stroke-dasharray="2 6" />
  </g>

  <!-- Orbital Ticks & Nodes -->
  <g fill="#00EC97" opacity="0.8">
    <circle cx="180" cy="380" r="3.5" filter="url(#bloom-fine)" />
    <circle cx="620" cy="380" r="3.5" filter="url(#bloom-fine)" />
    <circle cx="400" cy="160" r="3.5" filter="url(#bloom-fine)" />
    <circle cx="400" cy="600" r="3.5" filter="url(#bloom-fine)" />
    <circle cx="245" cy="225" r="2.5" />
    <circle cx="555" cy="225" r="2.5" />
    <circle cx="245" cy="535" r="2.5" />
    <circle cx="555" cy="535" r="2.5" />
  </g>

  <!-- ================= THE ALL-SEEING ORACLE IRIS ================= -->
  <g id="oracle-portal-core">
    <circle cx="400" cy="380" r="95" fill="none" stroke="url(#oracle-plasma)" stroke-width="6" opacity="0.85" filter="url(#bloom-heavy)" />
    <circle cx="400" cy="380" r="95" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9" filter="url(#bloom-fine)" />
    <circle cx="400" cy="380" r="90" fill="url(#oracle-core)" />
    <polygon points="400,315 456,347 456,412 400,445 344,412 344,347" fill="none" stroke="url(#near-halo)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <polygon points="400,330 443,355 443,405 400,430 357,405 357,355" fill="#040817" opacity="0.8" stroke="#38bdf8" stroke-width="0.8" />
    <circle cx="400" cy="380" r="8" fill="#ffffff" filter="url(#bloom-heavy)" />
    <circle cx="400" cy="380" r="4" fill="#ffffff" />
  </g>

  <!-- ================= WERR CRYSTALLINE CHEVRONS ================= -->
  <g id="werracle-left-cyan">
    <polygon points="160,250 115,365 240,435" fill="url(#c-wing)" stroke="#38bdf8" stroke-width="0.8" />
    <polygon points="160,250 240,435 295,395" fill="url(#c-crest)" stroke="#a5f3fc" stroke-width="0.8" />
    <polygon points="115,365 185,510 240,435" fill="url(#c-dark)" stroke="#0284c7" stroke-width="0.8" />
    <polygon points="185,510 320,620 240,435" fill="url(#c-spine)" stroke="#38bdf8" stroke-width="0.8" />
    <polygon points="295,395 240,435 320,620" fill="url(#c-crest)" stroke="#38bdf8" stroke-width="0.8" />
    <polygon points="295,395 320,620 355,490" fill="url(#c-spine)" stroke="#38bdf8" stroke-width="0.8" />
    <polygon points="295,395 355,490 400,345" fill="url(#c-dark)" stroke="#0369a1" stroke-width="0.8" />
    <polygon points="295,395 400,345 400,165" fill="url(#c-crest)" stroke="#a5f3fc" stroke-width="0.8" />
    <polygon points="400,165 400,345 355,490" fill="url(#c-crest)" opacity="0.9" stroke="#e0f2fe" stroke-width="0.6" />
    <polygon points="355,490 320,620 400,495" fill="url(#c-spine)" stroke="#38bdf8" stroke-width="0.8" />
  </g>

  <g id="werracle-right-gold">
    <polygon points="640,250 685,365 560,435" fill="url(#g-wing)" stroke="#fbbf24" stroke-width="0.8" />
    <polygon points="640,250 560,435 505,395" fill="url(#g-crest)" stroke="#fef08a" stroke-width="0.8" />
    <polygon points="685,365 615,510 560,435" fill="url(#g-dark)" stroke="#d97706" stroke-width="0.8" />
    <polygon points="615,510 480,620 560,435" fill="url(#g-spine)" stroke="#fbbf24" stroke-width="0.8" />
    <polygon points="505,395 560,435 480,620" fill="url(#g-crest)" stroke="#fbbf24" stroke-width="0.8" />
    <polygon points="505,395 480,620 445,490" fill="url(#g-spine)" stroke="#fbbf24" stroke-width="0.8" />
    <polygon points="505,395 445,490 400,345" fill="url(#g-dark)" stroke="#b45309" stroke-width="0.8" />
    <polygon points="505,395 400,345 400,165" fill="url(#g-crest)" stroke="#fef08a" stroke-width="0.8" />
    <polygon points="400,165 400,345 445,490" fill="url(#g-crest)" opacity="0.9" stroke="#fef9c3" stroke-width="0.6" />
    <polygon points="445,490 480,620 400,495" fill="url(#g-spine)" stroke="#fbbf24" stroke-width="0.8" />
  </g>

  <line x1="400" y1="165" x2="400" y2="495" stroke="#ffffff" stroke-width="2.5" filter="url(#bloom-fine)" />

  <path d="M 160 250 L 115 365 L 185 510 L 320 620 L 400 495" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" filter="url(#bloom-heavy)" opacity="0.8" />
  <path d="M 640 250 L 685 365 L 615 510 L 480 620 L 400 495" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round" filter="url(#bloom-heavy)" opacity="0.8" />
  <path d="M 160 250 L 295 395 L 400 165 L 505 395 L 640 250" fill="none" stroke="#ffffff" stroke-width="2.0" stroke-linejoin="round" filter="url(#bloom-fine)" />

  <!-- Diamond Flares -->
  <g transform="translate(400, 165)" filter="url(#star-sparkle)">
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
    <polygon points="0,-22 4,-4 22,0 4,4 0,22 -4,4 -22,0 -4,-4" fill="#ffffff" />
    <polygon points="0,-12 2,-2 12,0 2,2 0,12 -2,2 -12,0 -2,-2" fill="#00EC97" />
  </g>
  <g transform="translate(160, 250)" filter="url(#star-sparkle)">
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
    <polygon points="0,-15 3,-3 15,0 3,3 0,15 -3,3 -15,0 -3,-3" fill="#38bdf8" />
  </g>
  <g transform="translate(640, 250)" filter="url(#star-sparkle)">
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
    <polygon points="0,-15 3,-3 15,0 3,3 0,15 -3,3 -15,0 -3,-3" fill="#fbbf24" />
  </g>
  <g transform="translate(400, 495)" filter="url(#star-sparkle)">
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <polygon points="0,-14 2.5,-2.5 14,0 2.5,2.5 0,14 -2.5,2.5 -14,0 -2.5,-2.5" fill="#00EC97" />
  </g>
</svg>
