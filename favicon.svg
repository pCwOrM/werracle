  <rect width="128" height="128" rx="28" fill="#050814" />
  <circle cx="64" cy="64" r="52" fill="url(#oracle-glow)" />
  <polygon points="64,16 104,39 104,89 64,112 24,89 24,39" fill="none" stroke="url(#oracle-hex-grad)" stroke-width="3" stroke-linejoin="round" opacity="0.6" />
  <polygon points="64,28 94,45 94,83 64,100 34,83 34,45" fill="none" stroke="url(#oracle-hex-grad)" stroke-width="4.5" stroke-linejoin="round" filter="url(#hex-glow)" />
  <polygon points="64,38 84,64 64,90 44,64" fill="url(#oracle-inner-grad)" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
  <line x1="28" y1="64" x2="100" y2="64" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5" />
  <circle cx="64" cy="64" r="7" fill="#ffffff" filter="url(#hex-glow)" />
  <circle cx="64" cy="64" r="3.5" fill="#050814" />
