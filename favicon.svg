<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="oracle-hex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00ec97" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="oracle-inner-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ec97" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="oracle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ec97" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>
    <filter id="hex-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
